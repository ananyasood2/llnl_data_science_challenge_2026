<!doctype html><meta charset=utf-8><title>Registered strut review</title><div id=p style='width:100%;height:96vh'></div><script src='https://cdn.plot.ly/plotly-2.35.2.min.js'></script><script>fetch('interactive_3d_scene.json').then(x=>x.json()).then(d=>{let r=d.flagged_struts,w=d.registered_lattice_wireframe;Plotly.newPlot('p',[{x:w.x,y:w.y,z:w.z,mode:'lines',type:'scatter3d',name:'registered lattice graph',line:{color:'#8e99a5',width:2}},{x:r.map(a=>a.midpoint_zyx_downsampled[2]),y:r.map(a=>a.midpoint_zyx_downsampled[1]),z:r.map(a=>a.midpoint_zyx_downsampled[0]),text:r.map(a=>a.strut_id+' '+a.verdict),mode:'markers',type:'scatter3d',name:'screening candidates',marker:{size:3,color:r.map(a=>a.verdict=='missing'?'red':'orange')}}],{title:'Registered lattice with CT screening candidates (image-derived)',scene:{xaxis:{title:'x'},yaxis:{title:'y'},zaxis:{title:'z'}}})})</script>
