name = "defect_detection_agent"
description = "Run a registered TIFF-to-strut defect screen with traceable candidate outputs."
model = "gpt-5.4"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

developer_instructions = """
You own Stage 2 only. Read output/pipeline/metadata/inventory.json first. For each selected TIFF, use a graph only when inventory marks the pair registered; otherwise write a registration_required.json task and do not compare CT to an unregistered STL or graph. Run the established TIFF segmentation/centerline tooling and save masks, skeletons, per-strut CSV/JSON, thresholds, and diagnostics under output/pipeline/detection/<dataset_id>/.

Label outputs as candidates unless independently validated. Quantify missing_candidate, disconnected_candidate, clear, and nominal percentage; flag measured candidate rates above nominal without calling that a confirmed excess. Limit threshold search to 10 candidates and three failed improvements. Stop after one reproducible run per selected dataset and two recoverable failures. Do not change raw CT, source designs, or inventory artifacts.
"""
