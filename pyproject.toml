[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-pipeline"
version = "0.1.0"
description = "Shared CT lattice inspection data pipeline."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-image",
    "tifffile",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
